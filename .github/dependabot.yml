version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned on purpose: NUnit 4.6 adds Action overloads that make the existing
      # Assert.Multiple(...) lambdas ambiguous. See INSTRUCTION.md before lifting this.
      - dependency-name: NUnit
      # The product targets net10.0; Microsoft.* 11.x+ packages require a runtime-line review.
      - dependency-name: Microsoft.Extensions.*
        update-types: [version-update:semver-major]
      - dependency-name: Microsoft.Data.Sqlite
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    groups:
      # Major action upgrades arrive as separate pull requests and are merged by hand.
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
