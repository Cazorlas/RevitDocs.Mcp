name: Scheduled maintenance

# Weekly watch for the two things that break this server without a code change here:
#   1. A new Revit release (RevitVersions.Maximum + 1 appears on rvtdocs.com or NuGet).
#   2. The live rvtdocs.com API changing shape (the explicit online smoke tests fail).
# Either finding opens (or updates) a tracking issue. When the CLAUDE_CODE_OAUTH_TOKEN secret is
# configured, Claude Code then works the issue and opens a pull request for review.

on:
  schedule:
    - cron: "0 2 * * 1" # Mondays 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      supported: ${{ steps.release.outputs.supported }}
      candidate: ${{ steps.release.outputs.candidate }}
      rvtdocs: ${{ steps.release.outputs.rvtdocs }}
      nuget: ${{ steps.release.outputs.nuget }}
      nuget_versions: ${{ steps.release.outputs.nuget_versions }}
      smoke: ${{ steps.smoke.outcome }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Check for a new Revit release
        id: release
        shell: pwsh
        run: ./scripts/check-revit-release.ps1

      - name: Run live rvtdocs.com smoke tests
        id: smoke
        continue-on-error: true
        run: >
          dotnet test tests/Paper.RevitDocs.Mcp.Tests/Paper.RevitDocs.Mcp.Tests.csproj -c Release
          --filter "FullyQualifiedName~RevitApiOnlineSmokeTests"

  report:
    needs: watch
    if: needs.watch.outputs.rvtdocs == 'true' || needs.watch.outputs.nuget == 'true' || needs.watch.outputs.smoke == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    outputs:
      issue: ${{ steps.issue.outputs.number }}
      actionable: ${{ steps.issue.outputs.actionable }}
    steps:
      - name: Open or update the tracking issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SUPPORTED: ${{ needs.watch.outputs.supported }}
          CANDIDATE: ${{ needs.watch.outputs.candidate }}
          RVTDOCS: ${{ needs.watch.outputs.rvtdocs }}
          NUGET: ${{ needs.watch.outputs.nuget }}
          NUGET_VERSIONS: ${{ needs.watch.outputs.nuget_versions }}
          SMOKE: ${{ needs.watch.outputs.smoke }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create maintenance --color 5319e7 --description "Found by scheduled maintenance" 2>/dev/null || true

          if [ "$SMOKE" = "failure" ]; then
            title="rvtdocs.com live smoke test is failing"
            body="The weekly explicit \`RevitApiOnlineSmokeTests\` failed: $RUN_URL

          Determine whether rvtdocs.com changed its search/read API or content shape, or was only unavailable.
          Fix the provider behind the existing contracts with a checked-in fixture test, or close this issue if it was a transient outage."
            actionable=true
          else
            title="Support Revit $CANDIDATE"
            body="Scheduled maintenance found signals for Revit $CANDIDATE (currently supported up to $SUPPORTED): $RUN_URL

          - Documentation on rvtdocs.com: **$RVTDOCS**
          - Revit API assemblies on NuGet: **$NUGET** ${NUGET_VERSIONS:+($NUGET_VERSIONS)}

          Follow the new-Revit-version procedure in docs/maintenance.md."
            # Only raise the supported range once the documentation provider actually serves that year.
            actionable=$RVTDOCS
          fi

          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Still observed on $(date -u +%F): $RUN_URL (rvtdocs=$RVTDOCS, nuget=$NUGET, smoke=$SMOKE)"
            # The issue was already handed to Claude when it was opened; do not start duplicate work.
            actionable=false
          else
            url=$(gh issue create --title "$title" --body "$body" --label maintenance)
            number=${url##*/}
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "actionable=$actionable" >> "$GITHUB_OUTPUT"

  fix:
    needs: report
    if: needs.report.outputs.actionable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Skip when Claude is not configured
        if: env.HAS_CLAUDE_TOKEN != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; issue #${{ needs.report.outputs.issue }} is left for a maintainer."

      - uses: actions/checkout@v7
        if: env.HAS_CLAUDE_TOKEN == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        if: env.HAS_CLAUDE_TOKEN == 'true'
        with:
          dotnet-version: 8.0.x

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_CLAUDE_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 80
            --allowedTools "Bash(dotnet:*),Bash(pwsh:*),Bash(git:*),Bash(gh:*),Bash(curl:*)"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ needs.report.outputs.issue }}

            You are the maintainer of this repository. Read AGENTS.md, INSTRUCTION.md and
            docs/maintenance.md, then read issue ${{ needs.report.outputs.issue }} with `gh issue view`.

            Resolve it by following the matching procedure in docs/maintenance.md:
            test first, keep every MCP tool read-only, never infer unknown versions or content.
            This runner is Linux: run `dotnet test RevitDocs.Mcp.sln -c Release` and the explicit
            smoke tests yourself; the Windows CI job on the pull request is the authoritative gate.

            Commit on a new branch named `maintenance/issue-${{ needs.report.outputs.issue }}`, push it,
            and open a pull request with `gh pr create` whose body says "Closes #${{ needs.report.outputs.issue }}"
            and separates deterministic test evidence from live-provider evidence.
            If the finding was only a transient outage, comment that on the issue instead of opening a PR.
