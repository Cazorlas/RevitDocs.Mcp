name: Claude Code Review

# Claude reviews every pull request and posts inline comments. Dependabot and fork pull requests are
# skipped: GitHub withholds repository secrets from them, so the review could not authenticate.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read AGENTS.md first; its rules are the review standard.
            Get the change with `gh pr diff` and `gh pr view`, and read surrounding code as needed.

            Report only real problems, most severe first:
            - Correctness bugs and missing edge cases, with the concrete input that breaks.
            - Violations of the product boundary: a tool that is not read-only, anything written to
              stdout besides MCP JSON-RPC, unbounded network/content/paths, inferred or fabricated
              Revit versions or content, untrusted fetched text treated as instructions.
            - Security issues, including in GitHub workflows (secrets, token permissions, injection
              through PR or issue text).
            - Behavior changes without a deterministic test.

            Put each finding in an inline comment on the relevant line. Finish with one short
            `gh pr comment` summary; if there are no findings, say so in one line. No praise, no style nits.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
