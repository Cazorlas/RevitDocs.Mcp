name: Dependabot auto-merge

# Merges a Dependabot pull request after Windows CI passes on its exact head commit, but only for
# minor and patch updates. Major updates, and pull requests with commits from anyone else, stay open
# for a maintainer. Rulesets on a user-owned repository cannot grant bypass to GitHub Actions, so the
# merge uses AUTOMERGE_TOKEN: a fine-grained token of the repository admin, limited to this
# repository (Contents and Pull requests: read and write). It bypasses only "main: only admin merges";
# "main: PR + CI required" still applies. Without the secret the workflow only reports its decision.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to evaluate
        required: true

permissions:
  contents: read

concurrency:
  group: dependabot-automerge
  cancel-in-progress: false

jobs:
  merge:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.actor.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.inputs.pr || github.event.workflow_run.pull_requests[0].number }}
    steps:
      - name: Decide
        id: decide
        run: |
          set -euo pipefail
          if [ -z "$PR" ]; then echo "::notice::No pull request is attached to this CI run."; exit 0; fi

          pr=$(gh pr view "$PR" --json author,state,title,headRefName,headRefOid,isCrossRepository,commits)
          author=$(jq -r .author.login <<<"$pr")
          state=$(jq -r .state <<<"$pr")
          title=$(jq -r .title <<<"$pr")
          branch=$(jq -r .headRefName <<<"$pr")
          sha=$(jq -r .headRefOid <<<"$pr")
          fork=$(jq -r .isCrossRepository <<<"$pr")
          others=$(jq '[.commits[].authors[].login | select(. != "dependabot[bot]")] | length' <<<"$pr")
          echo "PR #$PR by $author ($state): $title [$branch @ $sha]"

          refuse() { echo "::notice::Not merging #$PR: $1"; exit 0; }
          # gh reports the Dependabot app as "app/dependabot".
          [[ "$author" == "app/dependabot" || "$author" == "dependabot[bot]" ]] || refuse "author is $author"
          [ "$state" = "OPEN" ] || refuse "state is $state"
          [ "$fork" = "false" ] || refuse "head is in a fork"
          [[ "$branch" == dependabot/* ]] || refuse "branch $branch is not a Dependabot branch"
          [ "$others" = "0" ] || refuse "it contains commits from someone other than Dependabot"

          # Grouped pull requests are minor/patch by configuration; a single update must keep its major.
          if [[ "$title" =~ the\ (minor-and-patch|actions)\ group ]]; then
            :
          elif [[ "$title" =~ from\ v?([0-9]+)[^\ ]*\ to\ v?([0-9]+) ]]; then
            [ "${BASH_REMATCH[1]}" = "${BASH_REMATCH[2]}" ] || refuse "major update ${BASH_REMATCH[1]} -> ${BASH_REMATCH[2]}"
          else
            refuse "cannot tell the update type from the title"
          fi

          verify=$(gh api "repos/$GH_REPO/commits/$sha/check-runs" \
            --jq '[.check_runs[] | select(.name == "Verify (build, test, vulnerable packages)")] | sort_by(.completed_at) | last | .conclusion')
          [ "$verify" = "success" ] || refuse "Windows CI on $sha is '$verify'"

          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Merge
        if: steps.decide.outputs.sha != ''
        env:
          SHA: ${{ steps.decide.outputs.sha }}
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::AUTOMERGE_TOKEN is not set; #$PR qualifies but was left for a maintainer."
            exit 0
          fi
          gh pr merge "$PR" --merge --admin --delete-branch --match-head-commit "$SHA"
